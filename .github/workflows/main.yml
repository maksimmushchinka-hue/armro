name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate pom.xml
        id: pom
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "pom.xml не найден в репозитории. Содержимое:"
            find . -not -path './.git/*' | head -n 100
            exit 1
          fi
          echo "Найден: $POM"
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -f "${{ steps.pom.outputs.dir }}/pom.xml" clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: WeepingMannequin
          path: ${{ steps.pom.outputs.dir }}/target/WeepingMannequin-*.jar
          if-no-files-found: error

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pom.outputs.dir }}/target/WeepingMannequin-*.jar
