# Радиус (в блоках), в котором манекен «видит» игроков
activation-radius: 50.0
# Если ближайший игрок дальше этого расстояния — манекен возвращается на точку спавна
return-radius: 40.0
# Угол обзора в градусах: если манекен в этом конусе и виден без преград — он замирает.
# (Угол 30° из ТЗ полностью перекрывается углом 60°, поэтому оставлен один параметр.)
view-angle: 60.0
# Скорость в блоках за тик (задача выполняется раз в 2 тика, шаг = speed * 2)
speed-per-tick: 0.15
# Ближе этого расстояния манекен к игроку не подходит
stop-distance: 1.2
# Раз в сколько секунд незаметного движения играть звук шагов позади игрока
footstep-interval-seconds: 10
# Громкость и радиус звука при замирании
sound-volume: 0.5
sound-radius: 10.0
# URL скина для головы (например, http://textures.minecraft.net/texture/...). Пусто = стандартная голова.
head-skin-url: ""
